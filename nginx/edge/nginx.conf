events {
    worker_connections 1024;
}

http {
    upstream chat_cluster {
        ip_hash;
        server chat1:5000;
        server chat2:5000;
    }

    upstream auth_service {
        server auth-service:4000;
    }

    server {
        listen 80;

        # 1. Direct Auth traffic to Auth Service
        location /api/auth {
            proxy_pass http://auth_service;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Distribute WebSocket and polling traffic directly across Chat Cluster
        location /socket.io {
            proxy_pass http://chat_cluster;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 3. Health check endpoint
        location /api/health {
            proxy_pass http://auth_service/api/health;
        }

        # 4. Default root response
        location / {
            return 200 '{"status":"running","service":"ripple-edge-nginx"}\n';
            add_header Content-Type application/json;
        }
    }
}
