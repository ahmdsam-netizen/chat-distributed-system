events {
    worker_connections 1024;
}

http {
    # Define the upstream backend pool (load balancing)
    upstream backend_servers {
        least_conn;  # Route to backend with fewest active connections

        server app1:3000;
        server app2:3000;
        server app3:3000;
    }

    server {
        listen 80;

        # Forward all API & WebSocket requests to backend pool
        location / {
            proxy_pass http://backend_servers;

            # Required for HTTP 1.1 and WebSocket upgrade
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Pass real client info to backend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Keep WebSocket connections alive
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
