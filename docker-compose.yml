# to run this file -- docker compose up

services:

  # --- NGINX LOAD BALANCER ---
  # Single entry point: frontend connects here, nginx distributes to app1/app2/app3
  nginx:
    build:
      context: ./nginx      # Build from nginx/Dockerfile (config is baked into the image)
      dockerfile: Dockerfile
    container_name: ripple-nginx
    ports:
      - "8080:80"  # All backend traffic goes through this port
    depends_on:
      - app1
      - app2
      - app3
    restart: unless-stopped

  # --- BACKEND INSTANCES ---
  app1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ripple-app1
    env_file:
      - .env
    environment:
      INSTANCE_ID: app1
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      REDIS_URL: redis://pub-sub:6379
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    expose:
      - "3000"  # Only visible inside Docker network (Nginx connects here)
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      pub-sub:
        condition: service_healthy

  app2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ripple-app2
    env_file:
      - .env
    environment:
      INSTANCE_ID: app2
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      REDIS_URL: redis://pub-sub:6379
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    expose:
      - "3000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      pub-sub:
        condition: service_healthy

  app3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ripple-app3
    env_file:
      - .env
    environment:
      INSTANCE_ID: app3
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      REDIS_URL: redis://pub-sub:6379
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    expose:
      - "3000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      pub-sub:
        condition: service_healthy

  # --- FRONTEND ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_BACKEND_HOST: nginx   # Nginx service name — vite.config.ts proxies /api and /socket.io here
      VITE_BACKEND_PORT: 80      # Nginx listens on port 80 inside Docker network
    depends_on:
      - nginx
    restart: unless-stopped

  # --- DATABASE ---
  db:
    image: postgres:alpine
    container_name: ripple-database
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - ${DB_PORT:-5432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- REDIS PUB/SUB ---
  pub-sub:
    image: redis:latest
    container_name: ripple-pub-sub
    restart: always
    ports:
      - ${REDIS_PORT:-6379}:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
