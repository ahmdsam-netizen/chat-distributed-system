services:

  # --- EDGE NGINX LOAD BALANCER ---
  edge-nginx:
    image: ripple-edge-nginx:latest
    build:
      context: ./nginx/edge
      dockerfile: Dockerfile
    container_name: ripple-edge-nginx
    ports:
      - "8080:80"
    depends_on:
      - chat1
      - chat2
      - auth-service
    restart: unless-stopped

  # --- AUTHENTICATION SERVICE ---
  auth-service:
    image: ripple-auth-service:latest
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: ripple-auth-service
    env_file:
      - .env
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key}
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080
    expose:
      - "4000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      chat1:
        condition: service_started

  # --- CHAT SERVICE INSTANCE 1 ---
  chat1:
    image: ripple-chat:latest
    build:
      context: ./services/chat
      dockerfile: Dockerfile
    container_name: ripple-chat1
    env_file:
      - .env
    environment:
      INSTANCE_ID: chat1
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      REDIS_URL: redis://pub-sub:6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key}
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080
    expose:
      - "5000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      pub-sub:
        condition: service_healthy

  # --- CHAT SERVICE INSTANCE 2 (Instance of same ripple-chat image) ---
  chat2:
    image: ripple-chat:latest
    container_name: ripple-chat2
    env_file:
      - .env
    environment:
      INSTANCE_ID: chat2
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      REDIS_URL: redis://pub-sub:6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key}
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080
    expose:
      - "5000"
    restart: unless-stopped
    depends_on:
      chat1:
        condition: service_started
      db:
        condition: service_healthy
      pub-sub:
        condition: service_healthy

  # --- FRONTEND CLIENT SPA ---
  frontend:
    image: ripple-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ripple-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_BACKEND_HOST: edge-nginx
      VITE_BACKEND_PORT: 80
    depends_on:
      - edge-nginx
    restart: unless-stopped

  # --- SHARED POSTGRES DATABASE ---
  db:
    image: postgres:16-alpine
    container_name: ripple-database
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-ripple}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ripplepassword}
      POSTGRES_DB: ${DB_NAME:-ripple}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - ${DB_PORT:-5432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ripple} -d ${DB_NAME:-ripple}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- SHARED REDIS PUB/SUB BROKER ---
  pub-sub:
    image: redis:latest
    container_name: ripple-pub-sub
    restart: always
    ports:
      - ${REDIS_PORT:-6379}:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
