# to run this file -- docker compose -f docker-compose-multiple.yml up

services:

  # --- NGINX LOAD BALANCER ---
  nginx:
    build:
      context: ./nginx      # Build from nginx/Dockerfile (config is baked into the image)
      dockerfile: Dockerfile
    container_name: ripple-nginx
    ports:
      - "8080:80"
    depends_on:
      - app1
      - app2
      - app3
    restart: unless-stopped

  # --- BACKEND INSTANCES ---
  app1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ripple-app1
    env_file:
      - .env
    environment:
      INSTANCE_ID: app1
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      REDIS_URL: redis://pub-sub:6379
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
      pub-sub:
        condition: service_healthy

  app2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ripple-app2
    env_file:
      - .env
    environment:
      INSTANCE_ID: app2
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      REDIS_URL: redis://pub-sub:6379
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
      pub-sub:
        condition: service_healthy

  app3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ripple-app3
    env_file:
      - .env
    environment:
      INSTANCE_ID: app3
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      REDIS_URL: redis://pub-sub:6379
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
      pub-sub:
        condition: service_healthy

  # --- DATABASE ---
  db:
    image: postgres:alpine
    container_name: ripple-database
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - ${DB_PORT:-5432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- REDIS PUB/SUB ---
  pub-sub:
    image: redis:latest
    container_name: ripple-pub-sub
    restart: always
    ports:
      - ${REDIS_PORT:-6379}:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
